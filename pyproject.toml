[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "green-queue"
version = "0.1.0"
description = "Show lower-carbon times to run HPC jobs"
readme = "README.md"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "requests>=2.31,<3",
    "termcolor>=3.1,<4",
]

[project.scripts]
green-queue = "green_queue.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

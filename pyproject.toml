[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-queue"
version = "0.1.0"
description = "Show lower-carbon times to run HPC jobs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
